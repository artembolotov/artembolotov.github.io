title: "Блог Артёма Болотова"
description: "Блог инженера-программиста о разработке приложений, web, технологиях и жизни"
baseurl: "/"
url: "https://bolotov.dev"
permalink: /blog/:year/:month/:day/:title
lang: "ru-RU"
future: true
author: "Артём Болотов"
email: "ar@bolotov.dev"

# Настройки SEO
# logo не задаём: с ним jekyll-seo-tag объявляет издателем записей организацию, а блог личный.
# Автор (ссылка на главную, аккаунт в X) описан в _data/authors.yml.
social:
  name: Артём Болотов
  links:
    - https://instagram.com/artembolotov
    - https://vk.com/artembolotov
    - https://x.com/artembolotov
    - https://t.me/artembolotov
    - https://t.me/bolotovblog
twitter:
  username: artembolotov

# Плагины
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Исключения из сборки
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - CLAUDE.md
  - pagefind.yml

# Коллекции и настройки постов
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Артём Болотов"
      image: "/blog/img/avatar.jpg"
      permalink: /blog/:year/:month/:day/:title
      canonical_url: ""
  # Картинка для превью главной блога и страниц разделов
  - scope:
      path: "blog"
      type: "pages"
    values:
      image: "/blog/img/avatar.jpg"

# Настройки сжатия
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: []
  ignore:
    envs: [development]
  blanklines: true
  profile: false
  startings: []

# Игнорировать конфигурацию темы
ignore_theme_config: true