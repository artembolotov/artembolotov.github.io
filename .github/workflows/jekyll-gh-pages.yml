# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # Уменьшенные копии картинок из галерей для srcset; кладутся рядом с оригиналами до сборки.
      - name: Generate gallery image variants
        run: |
          npm install --prefix "$RUNNER_TEMP/sharp" --no-save --no-audit --no-fund sharp@0.34.4
          SHARP_DIR="$RUNNER_TEMP/sharp" node .github/scripts/gallery-variants.cjs
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      # Поисковый индекс строится по готовому HTML; настройки в pagefind.yml.
      # jekyll-build-pages работает в Docker и оставляет _site за root.
      - name: Build search index
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          npx -y pagefind@1.5.2
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
